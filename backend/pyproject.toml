[project]
name = "cv-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "jinja2>=3.1.6",
    "odfpy>=1.4.1",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "striprtf>=0.0.33",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
